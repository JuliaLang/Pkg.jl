name: Run tests
on:
  pull_request:
  push:
    branches:
      - 'master'
      - 'release-*'
    tags: '*'
defaults:
  run:
    shell: bash
concurrency:
  # Skip intermediate builds: all builds except for builds on the `master` or `release-*` branches
  # Cancel intermediate builds: only pull request builds
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref != 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release-') || github.run_number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macOS-14 # arm
          - windows-latest
        julia-arch:
          - 'x64'
          - 'x86'
          - 'aarch64'
        pkg-server:
          - "pkg.julialang.org" # Default to this for all except specific cases
        julia-version:
          - 'nightly'
        exclude:
          - os: ubuntu-latest
            julia-arch: aarch64
          - os: windows-latest
            julia-arch: aarch64
          - os: macOS-14
            julia-arch: x86
          - os: macOS-14
            julia-arch: x64
        include:
          - os: ubuntu-latest
            julia-arch: 'x64'
            julia-version: 'nightly'
            pkg-server: ""
          - os: ubuntu-latest
            julia-arch: 'x64'
            julia-version: 'nightly'
            pkg-server: "pkg.julialang.org"
    steps:
      - name: Set git to use LF, fix TEMP, set JULIA_DEPOT_PATH (windows)
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          # See https://github.com/actions/virtual-environments/issues/712
          echo "TMP=${USERPROFILE}\AppData\Local\Temp" >> ${GITHUB_ENV}
          echo "TEMP=${USERPROFILE}\AppData\Local\Temp" >> ${GITHUB_ENV}
      - name: Exclude the workspace, temp dir and depot from Windows Defender
        # Real-time scanning makes creating many small files (registries,
        # package sources, clones) several times slower on the runners.
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:TEMP", "$env:USERPROFILE\.julia", "$env:RUNNER_TEMP"
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/cache@v3
      - name: Use two test workers on macOS
        # The macOS runners have little free memory, so the test runner
        # would use a single worker. Two workers fit if each is restarted
        # once its RSS grows past 1.5 GiB.
        if: runner.os == 'macOS'
        run: echo "JULIA_TEST_MAXRSS_MB=1500" >> ${GITHUB_ENV}
      - uses: julia-actions/julia-runtest@v1
        with:
          # Coverage is disabled: with `--code-coverage` julia cannot use the
          # native code of package images, so Pkg is compiled from scratch in
          # every test worker and in every julia process the tests spawn,
          # which roughly doubles the time of the test suite.
          coverage: false
          depwarn: error
          test_args: ${{ runner.os == 'macOS' && '--verbose --jobs=2' || '--verbose' }}
        env:
          JULIA_PKG_SERVER: ${{ matrix.pkg-server }}
          JULIA_TEST_VERBOSE_LOGS_DIR: ${{ github.workspace }}
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: ${{ join(matrix.*, '-') }}_Pkg.log
          path: ${{ github.workspace }}/Pkg*.log
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          # version: '1.6'
          version: 'nightly'
      - uses: julia-actions/cache@v3
      - name: Generate docs
        run: |
          julia --project --color=yes -e 'using Pkg; Pkg.activate("docs"); Pkg.instantiate();'
          julia --project=docs --color=yes docs/make.jl pdf
        env:
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pkg-docs
          path: docs/build/
